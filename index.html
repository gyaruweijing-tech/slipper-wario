<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="description" content="メイドインワリオ風の短時間ミニゲーム集">
<title>スリッパを捨てるな</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF7EF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スリッパ">
<style>
:root{
  --bg:#FBF7EF; --ink:#2B2A26; --sub:#7A7264;
  --green:#3F7D5E; --gold:#C9A227; --red:#D9534F; --paper:#FFFDF8;
  --line:#E4DACA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; user-select:none;
}
#app{
  position:relative; width:min(100vw,430px); height:min(100vh,780px);
  height:min(100dvh,780px);            /* スマホのアドレスバー伸縮に追従 */
  background:var(--paper); overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.12); border-radius:18px;
  display:flex; flex-direction:column;
  touch-action:manipulation;           /* ダブルタップ拡大を止める */
  -webkit-touch-callout:none;
}
/* ホーム画面から起動したときは全画面らしく見せる */
@media (display-mode:standalone){
  #app{border-radius:0; box-shadow:none}
  #hud{padding-top:calc(10px + env(safe-area-inset-top))}
}
/* 横向きは遊びにくいので縦にしてもらう */
#rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  #rotate{
    display:flex; position:absolute; inset:0; z-index:50; background:var(--paper);
    flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:24px;
  }
}
#app.shk{animation:appshake .3s}
@keyframes appshake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-7px,3px) rotate(-.8deg)}
  40%{transform:translate(6px,-4px) rotate(.8deg)}
  60%{transform:translate(-4px,-2px) rotate(-.4deg)}
  80%{transform:translate(3px,3px) rotate(.3deg)}
}
#app.tap{animation:tapshake .09s}
@keyframes tapshake{50%{transform:translate(0,-2px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#flash.on{animation:fl .2s ease-out}
#flash.bad{background:var(--red)}
@keyframes fl{from{opacity:.85}to{opacity:0}}
/* ---- HUD ---- */
#hud{
  flex:0 0 auto; padding:10px 12px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line); background:var(--paper); z-index:5;
}
#lives{display:flex;align-items:center;gap:5px}
#lives span{display:block;line-height:0}
#lives .off{opacity:.16}
#score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
#score small{color:var(--sub);font-weight:400;margin-right:4px;font-size:11px}
#mute{border:none;background:none;cursor:pointer;padding:2px 4px;opacity:.85;line-height:0}
#bar{height:6px;background:var(--line);position:relative;flex:0 0 auto}
#bar>i{position:absolute;inset:0 auto 0 0;background:var(--green);width:100%}
#bar.hot>i{background:var(--red)}
/* ---- stage ---- */
#stage{position:relative;flex:1 1 auto;overflow:hidden;background:
  radial-gradient(circle at 50% 30%, #fff 0%, var(--paper) 70%);}
.obj{position:absolute;transform:translate(-50%,-50%);cursor:pointer;touch-action:manipulation}
.obj.big{font-size:40px;line-height:1}
.obj.pop,.tile.pop{animation:pp .18s forwards}
@keyframes pp{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1}
  45%{transform:translate(-50%,-50%) scale(1.45);opacity:1}
  100%{transform:translate(-50%,-50%) scale(0);opacity:0}
}
/* ---- overlays ---- */
.veil{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px;z-index:10;background:rgba(251,247,239,.94);
}
.veil.clear{background:transparent;pointer-events:none}
.cmd{font-size:44px;font-weight:900;letter-spacing:4px;animation:pop .26s cubic-bezier(.2,1.7,.4,1)}
.cmd small{display:block;font-size:14px;font-weight:600;letter-spacing:1px;color:var(--sub);margin-top:8px}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.win{color:var(--green)} .lose{color:var(--red)}
h1{font-size:30px;line-height:1.35;letter-spacing:2px}
h1 em{font-style:normal;color:var(--green)}
.lead{color:var(--sub);font-size:14px;line-height:1.9}
button.btn{
  font:inherit;font-weight:800;font-size:17px;letter-spacing:2px;
  padding:14px 34px;border:none;border-radius:999px;
  background:var(--green);color:#fff;cursor:pointer;
  box-shadow:0 6px 0 #2F614A; transition:.06s;
}
button.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2F614A}
.creed{font-size:12px;color:var(--sub);line-height:2;letter-spacing:1px}
.big-num{font-size:64px;font-weight:900;color:var(--gold);line-height:1}
.combo{position:absolute;top:12px;left:0;right:0;text-align:center;font-weight:900;
  font-size:20px;color:var(--gold);z-index:12;pointer-events:none;animation:pop .3s}
.tile{
  position:absolute;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:14px;background:var(--paper);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;cursor:pointer;
}
.tile.done{background:var(--green);color:#fff;border-color:var(--green)}
.choice{
  position:absolute;transform:translate(-50%,-50%);
  padding:16px 22px;border:3px solid var(--ink);border-radius:16px;
  background:var(--paper);font-weight:900;font-size:19px;letter-spacing:1px;
  cursor:pointer;white-space:nowrap;
  transition:left .34s cubic-bezier(.6,0,.4,1), top .34s cubic-bezier(.6,0,.4,1);
}
.gauge{position:absolute;left:8%;right:8%;top:80%;height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.gauge>i{display:block;height:100%;background:var(--green);width:50%}
.zone{position:absolute;font-size:34px;transform:translate(-50%,-50%)}
.shake{animation:sh .28s}
@keyframes sh{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-57%,-50%)}75%{transform:translate(-43%,-50%)}}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub);pointer-events:none}
.hint.top{bottom:auto;top:36%}
.tierbadge{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;pointer-events:none}
.caption{position:absolute;top:7px;left:10px;font-size:12px;color:var(--sub);pointer-events:none;letter-spacing:1px}
.caption b{color:var(--ink);font-size:14px;font-weight:900}
.caption span{opacity:.9}
.how{font-size:14px;line-height:1.9;color:var(--ink);background:#fff;
  border:2px dashed var(--line);border-radius:14px;padding:12px 16px;max-width:300px}
.howlist{text-align:left;font-size:13px;line-height:1.7;max-width:320px;
  max-height:66%;overflow-y:auto;padding-right:4px}
.howlist li{list-style:none;margin-bottom:12px}
.howlist b{display:block;font-size:15px;color:var(--green)}
.sublink{background:none;border:none;font:inherit;font-size:13px;color:var(--sub);
  text-decoration:underline;cursor:pointer;padding:4px}
/* ---- オープニング。横長の映像を墨色で縁取って映画のように見せる ---- */
.veil.film{background:#15140F;padding:0;gap:0;justify-content:center;z-index:20}
.veil.film video{width:100%;height:auto;max-height:100%;display:block;
  border-top:2px solid rgba(201,162,39,.55);border-bottom:2px solid rgba(201,162,39,.55)}
.veil.film .skip{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:3px;color:rgba(251,247,239,.5);pointer-events:none}
#app.cinema #hud,#app.cinema #bar{display:none}
/* 差し替え用のキャラ画像。SVGと同じ扱いになるようにしておく */
img.art{display:block;width:auto;pointer-events:none;-webkit-user-drag:none}
img.art.logo{width:82%;max-width:310px;height:auto}
/* ---- かまえカード（Wiiの「フォーム」にあたる、操作の宣言） ---- */
.grip{display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:pop .22s cubic-bezier(.2,1.7,.4,1)}
.grip .gname{font-size:34px;font-weight:900;letter-spacing:6px}
.grip .ghint{font-size:13px;color:var(--sub);letter-spacing:1px}
.grip .gtag{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--gold)}
.twohand{position:absolute;top:28px;left:0;right:0;text-align:center;
  font-size:11px;font-weight:800;letter-spacing:2px;color:var(--gold);pointer-events:none}
.cmd .gripline{display:block;font-size:12px;font-weight:800;letter-spacing:3px;
  color:var(--gold);margin-bottom:6px}
.caption i{font-style:normal;color:var(--gold);font-weight:800;margin-right:5px}
/* ---- 新しい入力用のパーツ ---- */
.arrow{position:absolute;transform:translate(-50%,-50%);font-size:22px;font-weight:900;
  color:var(--gold);pointer-events:none;line-height:1}
.shelfbg{position:absolute;left:8%;right:8%;top:12%;height:28%;
  background:var(--bg);border:3px solid var(--ink);border-radius:6px;pointer-events:none}
.shelfbg::after{content:'';position:absolute;left:-3px;right:-3px;bottom:-3px;height:3px;background:var(--ink)}
.slot{position:absolute;transform:translate(-50%,-50%);width:66px;height:82px;
  border:3px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.55);
  pointer-events:none}
.slot.hit{border-color:var(--green);border-style:solid;background:rgba(63,125,94,.12)}
.obj.held{filter:brightness(.9)}
.obj.grab{z-index:8}
.bigarrow{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);
  text-align:center;font-size:76px;font-weight:900;color:var(--gold);
  pointer-events:none;line-height:1;animation:pop .2s}
.pips{position:absolute;left:0;right:0;bottom:12%;text-align:center;
  pointer-events:none;display:flex;gap:8px;justify-content:center}
.pips b{width:13px;height:13px;border-radius:99px;border:2px solid var(--ink);display:block}
.pips b.on{background:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="lives"></div>
    <div id="score"><small>まもった</small><span>0</span></div>
    <button id="mute" title="音のオンオフ" aria-label="音のオンオフ"></button>
  </div>
  <div id="bar"><i></i></div>
  <div id="stage"></div>
  <div id="flash"></div>
  <div id="rotate">
    <div id="rotico" style="line-height:0"></div>
    <h1 style="font-size:20px">画面を縦にしてね</h1>
    <p class="lead">スリッパは縦に置くものです。</p>
  </div>
</div>

<script>
/* =========================================================
   スリッパを捨てるな  —  スリッパ守護カルト 教典アプリ
   ミニゲーム7種 / クリック・タップのみ / 難易度3段階
   ========================================================= */
const app     = document.getElementById('app');
const stage   = document.getElementById('stage');
const flashEl = document.getElementById('flash');
const barEl   = document.getElementById('bar');
const barIn   = barEl.querySelector('i');
const livesEl = document.getElementById('lives');
const scoreEl = document.querySelector('#score span');
const muteBtn = document.getElementById('mute');

/* =======================================================
   1. 音（WebAudio・外部ファイルなし）
   ======================================================= */
const AU = { ctx:null, on:true, bgmTimer:null, bgmOn:false, step:0 };

function actx(){
  if(!AU.ctx){
    try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(AU.ctx.state === 'suspended') AU.ctx.resume();
  return AU.ctx;
}
function tone(freq, dur, type='square', vol=.16, when=0, slideTo=null){
  if(!AU.on || document.hidden) return;
  const c = actx(); if(!c) return;
  const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + .03);
}
let noiseBuf = null;
function noise(dur=.08, vol=.12, when=0){
  if(!AU.on || document.hidden) return;
  const c = actx(); if(!c) return;
  if(!noiseBuf){
    noiseBuf = c.createBuffer(1, c.sampleRate*.4, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const t = c.currentTime + when;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(g).connect(c.destination);
  s.start(t); s.stop(t + dur);
}
const SFX = {
  cmd:  () => { tone(150,.16,'square',.22); noise(.09,.16); },
  tap:  () => { tone(900,.05,'square',.10); },
  pop:  () => { tone(660,.05,'triangle',.13); tone(1320,.07,'triangle',.09,.03); },
  win:  () => { tone(660,.07,'square',.16); tone(880,.07,'square',.16,.06); tone(1320,.18,'square',.16,.12); },
  lose: () => { tone(300,.42,'sawtooth',.18,0,90); noise(.2,.10); },
  level:() => [0,4,7,12].forEach((n,i)=>tone(440*Math.pow(2,n/12),.13,'square',.15,i*.08)),
  over: () => [0,-2,-5,-9].forEach((n,i)=>tone(392*Math.pow(2,n/12),.35,'triangle',.16,i*.20)),
  start:() => [0,7,12].forEach((n,i)=>tone(330*Math.pow(2,n/12),.12,'square',.15,i*.07))
};
/* BGM: レベルが上がるとテンポも音程も上がる */
const RIFF = [0,7,12,7, 3,7,10,7];
function bgmStart(){ bgmStop(); AU.bgmOn = true; AU.step = 0; bgmTick(); }
function bgmStop(){ AU.bgmOn = false; clearTimeout(AU.bgmTimer); }
function bgmTick(){
  if(!AU.bgmOn) return;
  /* 画面が見えていない間は鳴らさない（裏で鳴り続けるのを防ぐ） */
  if(document.hidden){ AU.bgmTimer = setTimeout(bgmTick, 400); return; }
  const rate = Math.pow(1.11, S.level - 1);
  const iv   = 280 / rate;
  const base = 110 * Math.pow(2, (S.level - 1) / 24);
  tone(base * Math.pow(2, RIFF[AU.step % 8] / 12), iv/1000*.85, 'triangle', .075);
  if(AU.step % 2 === 0) noise(.025, .035);
  AU.step++;
  AU.bgmTimer = setTimeout(bgmTick, iv);
}
try{ AU.on = localStorage.getItem('slipperMute') !== '1'; }catch(e){}
muteBtn.onclick = () => {
  AU.on = !AU.on;
  muteBtn.innerHTML = soundIcon(AU.on);
  try{ localStorage.setItem('slipperMute', AU.on ? '0' : '1'); }catch(e){}
  if(AU.on) SFX.tap();
};

/* =======================================================
   2. 手触り（ヒットストップ・シェイク・フラッシュ・バイブ）
   ======================================================= */
let freezeUntil = 0;
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function flash(bad){
  flashEl.classList.toggle('bad', !!bad);
  flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
}
function shake(cls){
  app.classList.remove('shk','tap'); void app.offsetWidth; app.classList.add(cls);
}
function hitstop(ms){ freezeUntil = performance.now() + ms; deadline += ms; }
/* 小さな成功（1個たおした等）の気持ちよさ */
function poof(d){
  d.dead = true;
  d.style.pointerEvents = 'none';
  d.classList.add('pop');
  setTimeout(() => d.remove(), 190);
  SFX.pop(); hitstop(45); shake('tap'); buzz(12);
}

/* =======================================================
   3. 描画ヘルパ
   ======================================================= */
const SLIPPER_COLORS = ['#D9534F','#3F7D5E','#4A6FA5','#C9A227','#8E5AA8','#D97B3F'];
const SOLE = 'M30 4C46 4 55 18 55 42c0 26-9 44-25 44S5 68 5 42C5 18 14 4 30 4z';
let uid = 0;
function slipper(color, size, flip, pat){
  const id = 'cp' + (++uid);
  let deco = '';
  if(pat === 'dot')    deco = `<g clip-path="url(#${id})" fill="#FFFDF8" opacity=".85"><circle cx="19" cy="55" r="6"/><circle cx="41" cy="55" r="6"/><circle cx="30" cy="72" r="6"/></g>`;
  if(pat === 'stripe') deco = `<g clip-path="url(#${id})" fill="#FFFDF8" opacity=".85"><rect x="0" y="47" width="60" height="7"/><rect x="0" y="61" width="60" height="7"/><rect x="0" y="75" width="60" height="7"/></g>`;
  return `<svg width="${size}" height="${size*1.5}" viewBox="0 0 60 90" style="transform:scaleX(${flip?-1:1});display:block">
    <defs><clipPath id="${id}"><path d="${SOLE}"/></clipPath></defs>
    <path d="${SOLE}" fill="${color}" stroke="#2B2A26" stroke-width="3"/>
    ${deco}
    <path d="M8 34C18 16 42 16 52 34c-10 12-34 12-44 0z" fill="#FFFDF8" stroke="#2B2A26" stroke-width="3"/>
  </svg>`;
}

/* --- ここから下は全部このルールで描く（スタイル憲法） ---
   ・線は INK 一色 / 太さ3 固定
   ・グラデーション・ドロップシャドウ禁止
   ・1つにつき塗りは2色まで（本体色＋べた影）
   ・顔は点目と線の口だけ。白目・ハイライトなし
   ・影は落ち影を使わず、面の下側を同系の暗色でベタ塗り        */
const INK='#2B2A26', RED='#D9534F', GREEN='#3F7D5E', GOLD='#C9A227',
      CREAM='#FBF7EF', PAPER='#FFFDF8', BLUE='#4A6FA5', BROWN='#8A5A33';

function art(w, h, size, inner, flip){
  return `<svg width="${size}" height="${(size*h/w).toFixed(1)}" viewBox="0 0 ${w} ${h}"
    fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    style="display:block${flip ? ';transform:scaleX(-1)' : ''}">${inner}</svg>`;
}
/* 面の下側を暗色でベタ塗りする（版画っぽい影） */
function shade(path, color, from){
  const id = 'sh' + (++uid);
  return `<defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>
    <g clip-path="url(#${id})"><path d="M-5 ${from} H70 V99 H-5 Z" fill="${color}" stroke="none"/></g>`;
}

/* 横から見たスリッパ。真上から見た絵は小さくすると目玉に見えてしまうので、
   HUDのライフなど小さく出す場所ではこちらを使う */
const SIDE = 'M5 29H53C52 16 46 9 36 9C23 9 14 17 14 29Z';
function slipperSide(color, size, flip){
  return art(60, 34, size, `<path d="${SIDE}" fill="${color}"/><path d="${SIDE}"/>`, flip);
}
/* そろえて置かれた2足。1足だと目玉に見えるので、大きく見せる場所はこれ */
function slipperPair(color, size){
  return `<div style="display:flex;gap:${Math.round(size*.14)}px;line-height:0">
    ${slipper(color, size, false)}${slipper(color, size, true)}</div>`;
}

/* ゴミ袋。hard=true は縄で縛った硬いやつ（2回叩く） */
const BAG_SOFT = 'M30 17C47 17 55 30 55 43C55 53 44 58 30 58C16 58 5 53 5 43C5 30 13 17 30 17Z';
const BAG_HARD = 'M30 17L50 25L55 44L44 58L16 58L5 44L10 25Z';
function bag(size, hard){
  const p  = hard ? BAG_HARD : BAG_SOFT;
  const c  = hard ? '#A6403C' : RED;
  const sd = hard ? '#772B29' : '#A6403C';
  return art(60, 62, size, `
    <path d="M30 19L17 4L27 18Z" fill="${c}"/><path d="M30 19L43 4L33 18Z" fill="${c}"/>
    <path d="${p}" fill="${c}"/>
    ${shade(p, sd, 44)}
    ${hard ? `<path d="M7 33H53M9 44H51"/>` : ''}
    <path d="${p}"/>`);
}
/* ゴミ箱。lid クラスの g をずらすとフタが開く */
const BIN_BODY = 'M13 21L47 21L43 57L17 57Z';
function bin(size){
  return art(60, 62, size, `
    <path d="${BIN_BODY}" fill="${GREEN}"/>
    ${shade(BIN_BODY, '#2C5A43', 42)}

function el(html, x, y, cls){

function move(d, x, y){ d.style.left = x + '%'; d.style.top = y + '%'; }
const rnd  = (a,b) => a + Math.random()*(b-a);

/* =======================================================
   3b. 入力ヘルパ（たたく以外の操作）
   ステージは毎ラウンド innerHTML で消えるが、stage自身に付けた
   リスナーは残ってしまうので、必ずここで登録して clearStage で外す
   ======================================================= */
let listeners = [];
function on(t, type, fn){ t.addEventListener(type, fn); listeners.push([t, type, fn]); }
function dropListeners(){ listeners.forEach(([t,ty,f]) => t.removeEventListener(ty,f)); listeners = []; }

/* ステージ内の位置を % で返す。x と y でスケールが違うので dist は補正する */
function stagePct(e){
  const r = stage.getBoundingClientRect();
  return { x:(e.clientX - r.left)/r.width*100, y:(e.clientY - r.top)/r.height*100 };
}
const YK = 0.62;   /* 1%(縦) は 1%(横) のおよそ 0.62 個分 */
function near(p, x, y, r){ return Math.hypot(p.x - x, (p.y - y)*YK) <= r; }

/* こする：押している間の移動ベクトルを流し続ける。dir 指定があれば向きも見る */
function onRub(cb){
  stage.style.touchAction = 'none';
  let px = 0, py = 0, active = false;
  on(stage, 'pointerdown', e => {
    active = true; px = e.clientX; py = e.clientY;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });
  on(stage, 'pointermove', e => {
    if(!active) return;
    const dx = e.clientX - px, dy = e.clientY - py, L = Math.hypot(dx, dy);
    if(L < 10) return;
    px = e.clientX; py = e.clientY;
    cb(stagePct(e), dx/L, dy/L, L);
  });
  const end = () => { active = false; };
  on(stage, 'pointerup', end); on(stage, 'pointercancel', end);
}
/* おさえる：その要素を押さえている間だけ true */
function onHold(d){
  stage.style.touchAction = 'none';
  d.held = false;
  on(d, 'pointerdown', e => {
    e.stopPropagation(); d.held = true; d.classList.add('held');
    try{ d.setPointerCapture(e.pointerId); }catch(_){}
  });
  const up = () => { d.held = false; d.classList.remove('held'); };
  on(d, 'pointerup', up); on(d, 'pointercancel', up); on(d, 'lostpointercapture', up);
}
/* はこぶ：つまんで動かして離す。離した位置を % で返す */
function onDrag(d, onMove, onDrop){
  stage.style.touchAction = 'none';
  let grabbing = false;
  on(d, 'pointerdown', e => {
    e.stopPropagation(); grabbing = true; d.classList.add('grab');
    try{ d.setPointerCapture(e.pointerId); }catch(_){}
  });
  on(d, 'pointermove', e => {
    if(!grabbing) return;
    const p = stagePct(e);
    d.px = p.x; d.py = p.y; move(d, p.x, p.y);
    onMove && onMove(p);
  });
  const up = () => {
    if(!grabbing) return;
    grabbing = false; d.classList.remove('grab');
    onDrop && onDrop(d.px, d.py);
  };
  on(d, 'pointerup', up); on(d, 'pointercancel', up); on(d, 'lostpointercapture', up);
}

      ctx.frame(dt => {
        o.x += o.vx*dt; o.y += o.vy*dt;
        if(o.x < 12 || o.x > 88) o.vx *= -1;
        if(o.y < 12 || o.y > 86) o.vy *= -1;
        t.style.left = o.x + '%'; t.style.top = o.y + '%';
      });
    }
    t.onpointerdown = e => {
      e.stopPropagation();
      if(ch === seq[idx]){
        t.classList.add('done'); t.style.pointerEvents = 'none';
        SFX.tap(); hitstop(35);
        if(++idx === seq.length) ctx.win();
      }else{ t.classList.add('shake'); ctx.lose(); }
    };
    stage.appendChild(t);
  });
}});

/* 7. えらべ！ — 教義にしたがえ。「かたづける」が罠。善意でも手を出したら負け */
GAMES.push({ cmd:'えらべ！', grip:'tap',
  how:'教義にしたがって選べ。よその履物は、そのままにする。片づけるのも罪である。',
  sub: t => t>=3 ? '2回入れ替わる' : t>=2 ? '入れ替わるぞ' : '教義にしたがえ',
  build(ctx){
  const labels = ctx.tier >= 3
    ? ['すてる','そのままにする','かたづける','よかれと思う']
    : ['すてる','そのままにする','かたづける'];
  const ys = labels.length === 4 ? [22,42,62,82] : [28,50,72];

    d.onpointerdown = e => {
      e.stopPropagation();

      else { d.classList.add('shake'); ctx.lose(); }
    };

  });
  if(ctx.tier >= 2){
    const swap = () => { const s = shuffle(ys); nodes.forEach((d,i) => d.style.top = s[i] + '%'); SFX.tap(); };
    ctx.after(520, swap);
    if(ctx.tier >= 3) ctx.after(1180, swap);
  }
}});

/* 8. はらえ！【こする】— 積もった埃をこすって落とす。tier3 は矢印の向きどおりに */
GAMES.push({ cmd:'はらえ！', grip:'rub',
  how:'スリッパに積もった埃を、指でこすって払い落とせ。全部落とせば勝ち。',
  sub: t => t>=3 ? '矢印の向きへ' : t>=2 ? '数がおおい' : 'こすって落とせ',
  build(ctx){
  /* 埃はスリッパの上に積もっていてほしいので、大きく描いた靴の上に円状に配置する。
     向き指定がある tier3 は、隣の埃を巻き込んで理不尽に負けないよう間隔を広くとる */
  el(slipper(GREEN, 158, false), 50, 56).style.cursor = 'default';
  const n  = ctx.tier >= 2 ? 4 : 3;
  const rx = ctx.tier >= 3 ? 21 : 15, ry = ctx.tier >= 3 ? 14 : 11;
  const DIRS = [[1,0,'→'],[-1,0,'←'],[0,-1,'↑'],[0,1,'↓']];
  const bits = [];
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + i * (Math.PI*2/n);
    const x = 50 + Math.cos(a)*rx, y = 56 + Math.sin(a)*ry;
    const d = el(dust(rnd(30,36)), x, y);
    d.style.cursor = 'default';
    d.hx = x; d.hy = y;
    if(ctx.tier >= 3){
      /* 注意：DOM要素の .dir は文字方向の標準プロパティなので使えない */
      d.sweep = pick(DIRS);
      const a = document.createElement('div');
      a.className = 'arrow'; a.textContent = d.sweep[2];
      a.style.left = (x + d.sweep[0]*4.5) + '%';
      a.style.top  = (y + d.sweep[1]*4 - 4.5) + '%';
      stage.appendChild(a); d.arrow = a;
    }
    bits.push(d);
  }
  let left = n;
  const setPips = pips(n);
  onRub((p, ux, uy) => {
    /* 判定するのは指に一番近い1個だけ。
       全部を見ると、隣の埃（別の向き指定）まで巻き込んで理不尽に負ける */
    let best = null, bestD = Infinity;
    bits.forEach(d => {
      if(d.dead) return;
      const L = Math.hypot(p.x - d.hx, (p.y - d.hy)*YK);
      if(L < bestD){ bestD = L; best = d; }
    });
    if(!best || bestD > 8.5) return;
    if(best.sweep && (ux*best.sweep[0] + uy*best.sweep[1]) < .55){
      best.classList.add('shake'); ctx.lose(); return;
    }
    if(best.arrow) best.arrow.remove();
    poof(best); setPips(n - (--left));
    if(left === 0) ctx.win();
  });
}});

/* 9. おさえろ！【おさえる】— フタを押さえつづける。tier2 からは2つ同時＝両手 */
GAMES.push({ cmd:'おさえろ！', grip:'hold', two: t => t >= 2,
  how:'ゴミ箱のフタを指で押さえつづけろ。指を離すと開く。ゲージが満ちれば勝ち。',
  sub: t => t>=3 ? 'ふたが逃げる' : t>=2 ? 'ふたが2つ' : 'ゆびをはなすな',
  build(ctx){
  const n = ctx.tier >= 2 ? 2 : 1;
  const lids = [];
  for(let i=0;i<n;i++){
    const x = n === 1 ? 50 : (i === 0 ? 28 : 72);
    const y = n === 1 ? 46 : (i === 0 ? 34 : 60);
    const d = el(bin(84), x, y);
    d.hx = x; d.hy = y;
    d.lid = d.querySelector('.lid');
    onHold(d);
    if(ctx.tier >= 3){
      const o = { vx: rnd(-1,1)*16, vy: rnd(-1,1)*12 };
      ctx.frame(dt => {
        d.hx += o.vx*dt; d.hy += o.vy*dt;
        if(d.hx < 16 || d.hx > 84) o.vx *= -1;
        if(d.hy < 22 || d.hy > 74) o.vy *= -1;
        move(d, d.hx, d.hy);
      });
    }
    lids.push(d);
  }
  const g = document.createElement('div'); g.className = 'gauge'; g.innerHTML = '<i></i>';
  stage.appendChild(g);
  const gi = g.querySelector('i');
  gi.style.width = '0%';
  let p = 0, done = false;
  const need = Math.max(900, duration * .55);   /* 押さえ続ける必要のある時間 */
  ctx.frame(dt => {
    if(done) return;
    const all = lids.every(l => l.held);
    p = Math.max(0, Math.min(1, p + (all ? 1 : -.7) * dt * 1000 / need));
    gi.style.width = (p*100) + '%';
    lids.forEach(l => { if(l.lid) l.lid.setAttribute('transform', `translate(0,${l.held ? 0 : -7})`); });
    if(p >= 1){ done = true; ctx.win(); }
  });
}});

/* 10. しまえ！【はこぶ】— 下駄箱の枠までドラッグ。tier3 は枠が逃げる */
GAMES.push({ cmd:'しまえ！', grip:'drag',
  how:'スリッパをつまんで、点線の枠まで運んで離せ。全部おさめれば勝ち。',
  sub: t => t>=3 ? 'わくが逃げる' : t>=2 ? '2そくぶん' : 'わくまで運べ',
  build(ctx){
  const n = ctx.tier >= 2 ? 2 : 1;
  let left = n;
  const bgShelf = document.createElement('div');
  bgShelf.className = 'shelfbg';
  stage.appendChild(bgShelf);
  const cap = document.createElement('div');
  cap.className = 'hint top'; cap.style.top = '44%'; cap.textContent = '↑ 下駄箱にしまえ';
  stage.appendChild(cap);
  const setPips = pips(n);
  for(let i=0;i<n;i++){
    const sx = n === 1 ? 50 : (i === 0 ? 26 : 74), sy = 76;
    const slot = document.createElement('div');
    slot.className = 'slot';
    const s = { x: n === 1 ? 50 : (i === 0 ? 28 : 72), y: 26 };
    slot.style.left = s.x + '%'; slot.style.top = s.y + '%';
    stage.appendChild(slot);
    const d = el(slipper(SLIPPER_COLORS[i % SLIPPER_COLORS.length], 54, i % 2 === 1), sx, sy);
    d.px = sx; d.py = sy;
    if(ctx.tier >= 3){
      const o = { vx: rnd(-1,1)*17 };
      ctx.frame(dt => {
        s.x += o.vx*dt;
        if(s.x < 18 || s.x > 82) o.vx *= -1;
        slot.style.left = s.x + '%';
      });
    }
    onDrag(d,
      p => slot.classList.toggle('hit', !d.done && near(p, s.x, s.y, 13)),
      (x, y) => {
        if(d.done) return;
        if(near({x,y}, s.x, s.y, 13)){
          d.done = true;
          move(d, s.x, s.y);
          d.style.pointerEvents = 'none';
          slot.classList.add('hit');
          SFX.pop(); hitstop(45); buzz(12);
          setPips(n - (--left));
          if(left === 0) ctx.win();
        }else{
          slot.classList.remove('hit');
          d.classList.add('shake'); ctx.lose();
        }
      });
  }
}});

/* 11. ひっぱれ！【こする】— 矢印の向きへ払って引き寄せる。tier3 は向きが変わる */
GAMES.push({ cmd:'ひっぱれ！', grip:'rub',
  how:'大きな矢印の向きに画面をこすってスリッパを引き寄せろ。逆向きに払うと負け。',
  sub: t => t>=3 ? 'むきが変わる' : t>=2 ? '回数がおおい' : '矢印の向きへ',
  build(ctx){
  el(tidier(64, true), 80, 24).style.cursor = 'default';
  const s = el(slipper(RED, 58, false), 62, 52);
  s.style.cursor = 'default';
  const need = ctx.tier >= 3 ? 4 : ctx.tier >= 2 ? 3 : 2;
  const DIRS = [[-1,0,'←'],[1,0,'→'],[0,-1,'↑'],[0,1,'↓']];
  let dir = DIRS[0], hit = 0, done = false;
  const big = document.createElement('div');
  big.className = 'bigarrow'; big.textContent = dir[2];
  stage.appendChild(big);
  const setPips = pips(need);
  const reroll = () => {
    dir = pick(DIRS);
    big.textContent = dir[2];
    big.style.animation = 'none'; void big.offsetWidth; big.style.animation = '';
  };
  onRub((p, ux, uy) => {
    if(done) return;
    const d = ux*dir[0] + uy*dir[1];
    if(d < -.5){ done = true; s.classList.add('shake'); ctx.lose(); return; }
    if(d < .55) return;
    hit++; setPips(hit);
    SFX.tap(); hitstop(40); shake('tap'); buzz(10);
    move(s, 62 - (62-38)*(hit/need), 52);
    if(hit >= need){ done = true; return ctx.win(); }
    if(ctx.tier >= 3) reroll();
  });
}});

/* =======================================================
   5. ゲーム進行
   ======================================================= */
const S = { lives:3, score:0, round:0, level:1, combo:0, best:0, playing:false };
const SEEN = {};   /* そのミニゲームを一度でも見たか（初回だけ説明を出す） */
let frames = [], timeouts = [], rafId = null, last = 0, resolved = false, deadline = 0, duration = 0;

const tierOf = lv => Math.min(3, Math.ceil(lv/2));

function clearStage(){
  frames = [];
  timeouts.forEach(clearTimeout); timeouts = [];
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  stage.onpointerdown = null;
  dropListeners();                       /* こする/おさえる/はこぶ のリスナーを残さない */
  stage.style.touchAction = '';
  stage.innerHTML = '';
  freezeUntil = 0;
}
function after(ms, fn){ timeouts.push(setTimeout(fn, ms)); }

function drawHud(){
  livesEl.innerHTML = [0,1,2].map(i =>
    `<span class="${i < S.lives ? '' : 'off'}">${slipperSide(GREEN, 22)}</span>`).join('');
  scoreEl.textContent = S.score;
}
function veil(html, cls){
  const v = document.createElement('div');
  v.className = 'veil ' + (cls || '');
  v.innerHTML = html;
  stage.appendChild(v);
  return v;
}

/* --- タイトル --- */
function title(){
  bgmStop(); clearStage();
  S.lives = 3; S.score = 0; S.round = 0; S.level = 1; S.combo = 0;
  drawHud(); barIn.style.width = '100%'; barEl.classList.remove('hot');
  const bestLine = S.best ? `<p class="lead" style="margin-top:-6px">最高記録 <strong style="color:var(--gold)">${S.best}</strong></p>` : '';
  const v = veil(`
    ${ART.logo
      ? `<img src="${ART.logo}" alt="スリッパを捨てるな" class="art logo">`
      : slipperPair(GREEN, 42) + '<h1>スリッパを<br><em>捨てるな</em></h1>'}
    <p class="lead">あなたは、よかれと思って<br>よその一足を捨ててしまった。<br>その日から、守る側になった。</p>
    ${bestLine}
    <button class="btn" id="go">はじめる</button>
    <button class="sublink" id="howto">あそびかたを見る</button>
    <button class="sublink" id="op">オープニングを見る</button>
    <p class="creed">— 教義 —<br>一、よかれと思ってはならぬ<br>二、スリッパは家族である<br>三、片方だけでも家族である</p>`);
  const start = () => { bgmStart(); nextRound(); };
  v.querySelector('#go').onclick = () => {
    actx(); SFX.start();
    /* 初回だけ、押した直後にオープニングを流してからラウンド1へ */
    openingSeen() ? start() : (v.remove(), playOpening(start));
  };
  v.querySelector('#howto').onclick = () => howto();
  v.querySelector('#op').onclick = () => { v.remove(); playOpening(title); };
}

/* --- オープニング ---
   方針：これで詰まることが絶対にないようにする。
   ファイルが無い／再生できない／途中で失敗した、どの場合も黙って次へ進む。
   自動再生ではなく「はじめる」を押した直後に流すので、必ずユーザー操作が
   起点になり、スマホの自動再生ブロックに引っかからない。 */
const OPENING = 'assets/opening.mp4';

function playOpening(next){
  let done = false;
  const end = () => {
    if(done) return;
    done = true;
    clearTimeout(guard);
    try{ vid.pause(); vid.removeAttribute('src'); vid.load(); }catch(e){}
    app.classList.remove('cinema');
    wrap.remove();
    try{ localStorage.setItem('slipperOpening', '1'); }catch(e){}
    next();
  };
  const wrap = document.createElement('div');
  wrap.className = 'veil film';
  wrap.style.opacity = '0';        /* 再生が始まるまで黒幕を見せない */
  wrap.innerHTML = `<video playsinline webkit-playsinline muted preload="auto"></video>
    <div class="skip">タップでとばす</div>`;
  stage.appendChild(wrap);
  const vid = wrap.querySelector('video');
  /* 何かの理由で再生も失敗通知も来ないときの保険 */
  const guard = setTimeout(end, 20000);
  vid.onplaying = () => { wrap.style.opacity = '1'; app.classList.add('cinema'); };
  vid.onended   = end;
  vid.onerror   = end;
  wrap.onpointerdown = end;
  vid.src = OPENING;
  const pr = vid.play();
  if(pr && pr.catch) pr.catch(end);
}
/* 初回だけ流す。2回目以降はタイトルの「オープニングを見る」から */
function openingSeen(){
  try{ return localStorage.getItem('slipperOpening') === '1'; }catch(e){ return true; }
}

/* --- あそびかた一覧 --- */
function howto(){
  const grips = Object.keys(GRIPS).map(k =>
    `<li style="display:flex;gap:10px;align-items:center">${gripIcon(k,34)}
      <span><b style="display:inline;color:var(--gold)">${GRIPS[k].name}</b> ${GRIPS[k].hint}</span></li>`).join('');
  const items = GAMES.map(g =>
    `<li><b>${g.cmd}<span style="color:var(--gold);font-size:12px;margin-left:8px">${GRIPS[g.grip].name}</span></b>${g.how}</li>`).join('');
  const v = veil(`
    <h1 style="font-size:22px">あそびかた</h1>
    <p class="lead" style="margin-top:-6px">制限時間は約4秒。ライフ3つ。<br>4ラウンドごとに速くなる。</p>
    <ul class="howlist">
      <li><b>まず「かまえ」が出る</b>お題の前に、どう操作するかが出ます。
        操作が前と変わるときだけ出るので、出たら持ちかたを変える合図です。</li>
      ${grips}
      <li style="border-top:1px solid var(--line);padding-top:12px"><b>お題</b></li>
      ${items}
    </ul>
    <button class="btn" id="back">もどる</button>`);
  v.querySelector('#back').onclick = () => { v.remove(); };
}

/* --- お題 → プレイ --- */
let lastGrip = null;

function nextRound(){
  clearStage();
  S.round++;
  if(S.round > 1 && (S.round - 1) % 4 === 0){ S.level++; return speedUp(); }
  const g = GAMES[(Math.random()*GAMES.length)|0];
  const tier = tierOf(S.level);
  const sub = typeof g.sub === 'function' ? g.sub(tier) : g.sub;
  const two = !!(g.two && g.two(tier));
  /* そのミニゲームが初めて出たときだけ、遊びかたを長めに見せる */
  const first = !SEEN[g.cmd];
  SEEN[g.cmd] = 1;
  barIn.style.width = '100%'; barEl.classList.remove('hot');

  /* かまえカード（Wiiの「フォーム」）。
     操作が前のラウンドと変わるときだけ出す。カードが出ること自体が
     「持ちかたを変えろ」の合図になるので、同じ操作が続くならテンポを優先して省く */
  const showGrip = g.grip !== lastGrip || first;
  lastGrip = g.grip;
  const cmdCard = () => {
    const v = veil(`<div class="cmd"><span class="gripline">${GRIPS[g.grip].name}</span>${g.cmd}<small>${sub}</small></div>
      ${first ? `<p class="how">${g.how}</p><p class="creed">はじめて出たお題</p>` : ''}`);
    SFX.cmd(); shake('tap'); flash(false);
    after(first ? 2100 : 700, () => { v.remove(); play(g, tier, sub, two); });
  };
  if(!showGrip) return cmdCard();
  const gv = veil(`<div class="grip">
    ${gripIcon(g.grip, 76)}
    <div class="gname">${GRIPS[g.grip].name}</div>
    <div class="ghint">${GRIPS[g.grip].hint}</div>
    ${two ? '<div class="gtag">ゆびを 2ほん</div>' : ''}
  </div>`);
  SFX.tap();
  after(first ? 950 : 620, () => { gv.remove(); cmdCard(); });
}

function speedUp(){
  SFX.level(); flash(false);
  const v = veil(`<div class="big-num">LV.${S.level}</div>
    <div class="cmd" style="font-size:26px">はやくなる！</div>
    <div class="tierbadge">むずかしさ ${tierOf(S.level)} / 3</div>`);
  after(1050, () => { v.remove(); nextRound(); });
}

function play(g, tier, sub, two){
  resolved = false; S.playing = true; freezeUntil = 0;
  const rate = Math.pow(1.17, S.level - 1);
  duration = Math.max(1900, 4300 / rate);
  deadline = performance.now() + duration;

  const ctx = {
    level: S.level, tier, rate,
    frame: fn => frames.push(fn),
    after,
    win:  () => finish(true),
    lose: () => finish(false)
  };
  g.build(ctx);
  /* プレイ中もお題を出しっぱなしにする（何をすればいいか見失わないように） */
  const cap = document.createElement('div');
  cap.className = 'caption';
  cap.innerHTML = `<i>${GRIPS[g.grip].name}</i><b>${g.cmd}</b>${sub ? ' <span>' + sub + '</span>' : ''}`;
  stage.appendChild(cap);
  if(two){
    const t2 = document.createElement('div');
    t2.className = 'twohand'; t2.textContent = 'ゆびを 2ほん';
    stage.appendChild(t2);
  }
  if(tier > 1){
    const b = document.createElement('div');
    b.className = 'tierbadge'; b.textContent = 'むずかしさ ' + tier;
    stage.appendChild(b);
  }

  last = performance.now();
  const loop = now => {
    rafId = requestAnimationFrame(loop);
    if(now < freezeUntil){ last = now; return; }
    const dt = Math.min(.05, (now - last)/1000); last = now;
    if(resolved) return;
    const rem = Math.max(0, deadline - now);
    barIn.style.width = (rem/duration*100) + '%';
    barEl.classList.toggle('hot', rem < duration*.3);
    frames.slice().forEach(f => f(dt));
    if(rem <= 0 && !resolved) finish(false);
  };
  rafId = requestAnimationFrame(loop);
}

function finish(ok){
  if(resolved) return;
  resolved = true; S.playing = false; freezeUntil = 0;
  stage.onpointerdown = null;
  stage.querySelectorAll('.obj,.tile,.choice').forEach(o => o.style.pointerEvents = 'none');

  if(ok){
    S.score++; S.combo++;
    SFX.win(); flash(false); buzz(25);
  }else{
    S.lives--; S.combo = 0;
    SFX.lose(); flash(true); shake('shk'); buzz([35,45,70]);
  }
  drawHud();

  const msg = ok
    ? pick(['まもった！','いける！','まだ使える！','家族を守った'])
    : pick(['捨てられた…','あぁ…','片方だけになった…','燃えるゴミへ…']);
  veil(`<div class="cmd ${ok?'win':'lose'}" style="font-size:32px">${msg}</div>`, 'clear');
  if(ok && S.combo >= 3){
    const c = document.createElement('div');
    c.className = 'combo'; c.textContent = `${S.combo}れんぞく まもった！`;
    stage.appendChild(c);
  }
  after(880, () => { S.lives <= 0 ? gameOver() : nextRound(); });
}

function gameOver(){
  bgmStop(); clearStage();
  SFX.over();
  barIn.style.width = '0%';
  const isBest = S.score > S.best && S.score > 0;
  if(isBest){ S.best = S.score; try{ localStorage.setItem('slipperBest', S.best); }catch(e){} }
  const rank = S.score >= 30 ? '玄関大明神' : S.score >= 20 ? '守護長老'
             : S.score >= 12 ? '中堅信徒' : S.score >= 6 ? '見習い' : '一般人';
  const v = veil(`
    <div style="display:flex;align-items:flex-end;gap:16px;line-height:0">${guardian(64)}${bin(54)}</div>
    <h1 style="font-size:24px">スリッパは<br>捨てられた</h1>
    <div class="big-num">${S.score}</div>
    ${isBest ? '<div class="combo" style="position:static">自己ベスト更新！</div>' : ''}
    <p class="lead">まもったスリッパ　（最高 ${S.best}）<br>
      <strong style="color:var(--green);font-size:18px">称号：${rank}</strong></p>
    <button class="btn" id="again">もういちど守る</button>`);
  v.querySelector('#again').onclick = () => title();
}

/* タブを離れている間は時間を止める（戻った瞬間に即死しないように） */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    hiddenAt = performance.now();
    clearTimeout(AU.bgmTimer);
  }else{
    if(hiddenAt){
      deadline += performance.now() - hiddenAt;
      last = performance.now();
      hiddenAt = 0;
    }
    if(AU.bgmOn){ clearTimeout(AU.bgmTimer); bgmTick(); }
  }
});

try{ S.best = parseInt(localStorage.getItem('slipperBest')) || 0; }catch(e){}
muteBtn.innerHTML = soundIcon(AU.on);
document.getElementById('rotico').innerHTML = slipperPair(GREEN, 34);
drawHud();
title();
loadArt();   /* assets/ にキャラ画像があれば差し替える。無ければ何も起きない */

/* オフラインでも遊べるように Service Worker を登録（file:// で開いたときは何もしない） */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
